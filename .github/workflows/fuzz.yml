# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Native Go fuzzing of the problem-body parser and the success-response
# decoder, 60 seconds per target, on every push and pull request and
# weekly. A crash fails the job and the failing input is uploaded;
# commit it under testdata/fuzz as a regression with the fix.
name: Fuzz

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (60s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make fuzz FUZZTIME=60s
      - name: Failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: testdata/fuzz
          if-no-files-found: ignore
