#
# Lint, build and unit-test the client (100% statement and branch
# coverage) on the two Go releases the Go team supports, check the exported API against
# the last tag, then run the full regression (conformance kit, live
# typed tests, every example, every README block and a benchmark smoke)
# against crypto-server built from the commit pinned in ci/server.ref.
# Fuzzing runs in fuzz.yml.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The job names are required status checks on main; renaming one
    # needs the branch protection updated in the same change.
    name: gofmt, vet, staticcheck, complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make versions fmt-check vet staticcheck complexity

  vulncheck:
    name: govulncheck (dependency advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The module is stdlib-only, so govulncheck checks the standard
    # library of the newest supported Go against the Go vulnerability
    # database. It needs no secret and fails on any reachable advisory.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make vulncheck

  test:
    name: build and unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The two releases the Go team supports; 1.26 is the go.mod floor.
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      # scripts/coverage.sh fails below 100.0% of statements,
      # scripts/branch-coverage.sh (gobco) below 100% of branches.
      - run: make build test branch-coverage

  api:
    name: API-breakage check (gorelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gorelease compares the exported API with the last release tag
    # before the version in version.go; it has nothing to compare while
    # version.go still names the latest tag (scripts/api-check.sh).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make api-check

  conformance:
    name: conformance kit against crypto-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Builds crypto-server at the commit in ci/server.ref; make
    # regression starts it on loopback with a random API key and JWT
    # secret, runs make check and make conformance against it (every kit
    # vector, the live tests, every example and every README block),
    # smoke-runs every benchmark once, and stops it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ci/server.ref comes from the pull request, so it is checked to be
      # a full commit SHA and fetched with git rather than handed to
      # actions/checkout as a ref.
      # Dot-prefixed, so `go list ./...` and every ./... tool skip it.
      - name: Check out crypto-server at the commit in ci/server.ref
        run: |
          ref="$(tr -d '[:space:]' < ci/server.ref)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ci/server.ref must hold a full 40-character commit SHA" >&2
            exit 1
          fi
          git init -q .server
          git -C .server fetch -q --depth 1 \
            https://github.com/sebastienrousseau/crypto-service.git "$ref"
          git -C .server checkout -q --detach FETCH_HEAD
          test "$(git -C .server rev-parse HEAD)" = "$ref"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build the server
        working-directory: .server
        run: |
          pnpm install --frozen-lockfile
          pnpm -r run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Regression against the pinned server
        env:
          CRYPTO_SERVICE_SERVER_DIR: ${{ github.workspace }}/.server
        run: make regression
