# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Lint, build and unit-test the client (100% statement coverage) on the
# two Go releases the Go team supports, check the exported API against
# the last tag, then run the full regression (conformance kit, live
# typed tests, every example, every README block and a benchmark smoke)
# against crypto-server built from the commit pinned in ci/server.ref.
# Fuzzing runs in fuzz.yml.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The job names are required status checks on main; renaming one
    # needs the branch protection updated in the same change.
    name: gofmt, vet, staticcheck, complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make versions fmt-check vet staticcheck complexity

  vulncheck:
    name: govulncheck (dependency advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The module is stdlib-only, so govulncheck checks the standard
    # library of the newest supported Go against the Go vulnerability
    # database. It needs no secret and fails on any reachable advisory.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make vulncheck

  test:
    name: build and unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The two releases the Go team supports; 1.26 is the go.mod floor.
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      # scripts/coverage.sh fails below 100.0% of statements.
      - run: make build test

  api:
    name: API-breakage check (gorelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gorelease compares the exported API with the last release tag; a
    # no-op until the first tag exists (scripts/api-check.sh).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make api-check

  conformance:
    name: conformance kit against crypto-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Builds crypto-server at the commit in ci/server.ref; make
    # regression starts it on loopback with a random API key and JWT
    # secret, runs make check and make conformance against it (every kit
    # vector, the live tests, every example and every README block),
    # smoke-runs every benchmark once, and stops it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the server pin
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < ci/server.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/crypto-service
          ref: ${{ steps.pin.outputs.ref }}
          path: server
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build the server
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm -r run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Regression against the pinned server
        env:
          CRYPTO_SERVICE_SERVER_DIR: ${{ github.workspace }}/server
        run: make regression
